name: Bounty 1 full-genome chromatin condition pilot

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bounty1-chromatin-condition-pilot.yml'
  push:
    branches: [bounty-1-real-pipeline]
    paths:
      - '.github/workflows/bounty1-chromatin-condition-pilot.yml'

permissions:
  contents: read

concurrency:
  group: bounty1-chromatin-condition-pilot
  cancel-in-progress: false

jobs:
  wt_condition:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      CONDITION: WT
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load pinned analysis image from shared cache
        uses: docker/build-push-action@v6
        with:
          context: bounty1
          load: true
          pull: true
          tags: bounty1-pace:chromatin-condition-pilot
          cache-from: type=gha,scope=bounty1-docker
          cache-to: type=gha,mode=max,scope=bounty1-docker

      - name: Build condition manifest
        run: |
          set -euo pipefail
          mkdir -p chromatin/{ref,work,qc,results}
          python3 - <<'PY'
          import csv, json, os
          condition = os.environ['CONDITION']
          rows = []
          with open('bounty1/resources/samplesheet.csv', newline='', encoding='utf-8') as fh:
              for row in csv.DictReader(fh):
                  if row['condition'] == condition and row['assay'] == 'CHIP' and row['mark'] in {'H3K9ac', 'H3K56ac'}:
                      rows.append({
                          'sample_id': row['sample_id'], 'kind': 'treatment', 'mark': row['mark'],
                          'replicate': row['replicate'], 'r1': row['fastq_1'], 'r2': row['fastq_2'],
                          'md5_r1': row['read1_md5'], 'md5_r2': row['read2_md5'],
                      })
          with open('bounty1/resources/chip_inputs.csv', newline='', encoding='utf-8') as fh:
              matches = [r for r in csv.DictReader(fh) if r['condition'] == condition]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one matched INPUT for {condition}, got {len(matches)}')
          r = matches[0]
          rows.insert(0, {
              'sample_id': r['sample_id'], 'kind': 'input', 'mark': 'INPUT', 'replicate': r['replicate'],
              'r1': r['fastq_1'], 'r2': r['fastq_2'], 'md5_r1': r['read1_md5'], 'md5_r2': r['read2_md5'],
          })
          treatments = [r for r in rows if r['kind'] == 'treatment']
          expected = [('H3K56ac','1'), ('H3K56ac','2'), ('H3K9ac','1'), ('H3K9ac','2')]
          if len(treatments) != 4 or sorted((r['mark'], r['replicate']) for r in treatments) != expected:
              raise SystemExit(f'incomplete treatment set for {condition}')
          with open('chromatin/condition.json', 'w', encoding='utf-8') as out:
              json.dump(rows, out, indent=2)
          with open('chromatin/rows.tsv', 'w', encoding='utf-8', newline='') as out:
              for row in rows:
                  out.write('\t'.join(str(row[k]) for k in ('sample_id','kind','mark','replicate','r1','r2','md5_r1','md5_r2')) + '\n')
          PY
          cat chromatin/condition.json
          test "$(wc -l < chromatin/rows.tsv)" -eq 5

      - name: Prepare verified complete hg19 Bowtie2 reference
        run: |
          set -euo pipefail
          start=$(date +%s)
          curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors \
            -o chromatin/ref/hg19.fa.gz \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/hg19.fa.gz
          curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors \
            -o chromatin/ref/md5sum.txt \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/md5sum.txt
          (
            cd chromatin/ref
            grep -E '[[:space:]]hg19.fa.gz$' md5sum.txt > hg19.fa.gz.md5
            md5sum --check hg19.fa.gz.md5
            gzip -t hg19.fa.gz
            gzip -d hg19.fa.gz
          )
          docker run --rm -v "$PWD/chromatin:/chromatin" bounty1-pace:chromatin-condition-pilot bash -lc '
            set -euo pipefail
            bowtie2-build --threads 4 /chromatin/ref/hg19.fa /chromatin/ref/hg19 \
              > /chromatin/qc/bowtie2-build.stdout.log \
              2> /chromatin/qc/bowtie2-build.stderr.log
          '
          sha256sum chromatin/ref/hg19.fa > chromatin/qc/hg19.fa.sha256
          echo $(( $(date +%s) - start )) > chromatin/qc/reference-wall-seconds.txt
          du -sh chromatin/ref > chromatin/qc/reference-size.txt
          df -h > chromatin/qc/disk-after-reference.txt

      - name: Stream full FASTQs, align, deduplicate, call peaks and retain compact fragment evidence
        run: |
          set -euo pipefail
          docker run --rm \
            -e CONDITION \
            -v "$PWD/chromatin:/chromatin" \
            bounty1-pace:chromatin-condition-pilot bash -lc '
              set -euo pipefail
              cd /chromatin/work

              align_sample() {
                local sample="$1" r1="$2" r2="$3" md5_1="$4" md5_2="$5"
                local start
                start=$(date +%s)
                echo "[$(date -Is)] START ${sample}" | tee -a /chromatin/qc/timeline.log
                python3 /work/bin/stream_interleaved_fastq.py \
                  --r1-source "$r1" --r2-source "$r2" \
                  --r1-md5 "$md5_1" --r2-md5 "$md5_2" | \
                fastp --stdin --interleaved_in --stdout --thread 4 \
                  --json "/chromatin/qc/${sample}.fastp.json" \
                  --html "/chromatin/qc/${sample}.fastp.html" \
                  2> "/chromatin/qc/${sample}.fastp.stderr.log" | \
                bowtie2 --very-sensitive -x /chromatin/ref/hg19 --interleaved - -p 4 \
                  2> "/chromatin/qc/${sample}.bowtie2.log" | \
                samtools view -b - | \
                samtools sort -n -@ 4 -m 256M -o "${sample}.name.bam"
                samtools fixmate -m "${sample}.name.bam" "${sample}.fixmate.bam"
                rm -f "${sample}.name.bam"
                samtools sort -@ 4 -m 256M -o "${sample}.position.bam" "${sample}.fixmate.bam"
                rm -f "${sample}.fixmate.bam"
                samtools markdup -r -@ 4 "${sample}.position.bam" "${sample}.dedup.bam"
                rm -f "${sample}.position.bam"
                samtools view -b -q 30 "${sample}.dedup.bam" | \
                  samtools sort -@ 4 -m 256M -o "${sample}.mapq30.bam"
                rm -f "${sample}.dedup.bam"
                samtools index "${sample}.mapq30.bam"
                samtools flagstat "${sample}.mapq30.bam" > "/chromatin/qc/${sample}.flagstat.txt"
                test "$(samtools view -c "${sample}.mapq30.bam")" -gt 0
                echo $(( $(date +%s) - start )) > "/chromatin/qc/${sample}.align-wall-seconds.txt"
                df -h > "/chromatin/qc/${sample}.disk-after-align.txt"
                echo "[$(date -Is)] DONE ${sample}" | tee -a /chromatin/qc/timeline.log
              }

              export_fragments() {
                local sample="$1"
                samtools view -f 67 -F 2304 -q 30 "${sample}.mapq30.bam" | \
                  awk '"'"'BEGIN{OFS="\t"} $9 != 0 {p=$4-1; m=$8-1; s=(p<m?p:m); l=($9<0?-$9:$9); e=s+l; if(e>s) print $3,s,e}'"'"' | \
                  gzip -1 > "/chromatin/results/${sample}.fragments.bed.gz"
                gzip -t "/chromatin/results/${sample}.fragments.bed.gz"
                gzip -cd "/chromatin/results/${sample}.fragments.bed.gz" | wc -l \
                  > "/chromatin/results/${sample}.total-fragments.txt"
                test "$(cat "/chromatin/results/${sample}.total-fragments.txt")" -gt 0
              }

              input_sample=""
              while IFS=$'"'"'\t'"'"' read -r sample kind mark rep r1 r2 md5_1 md5_2; do
                if [[ "$kind" != input ]]; then continue; fi
                align_sample "$sample" "$r1" "$r2" "$md5_1" "$md5_2"
                input_sample="$sample"
                export_fragments "$sample"
              done < /chromatin/rows.tsv
              [[ -n "$input_sample" ]]

              while IFS=$'"'"'\t'"'"' read -r sample kind mark rep r1 r2 md5_1 md5_2; do
                if [[ "$kind" != treatment ]]; then continue; fi
                align_sample "$sample" "$r1" "$r2" "$md5_1" "$md5_2"
                macs3 callpeak \
                  -t "${sample}.mapq30.bam" -c "${input_sample}.mapq30.bam" \
                  -f BAMPE -g hs -n "${sample}_hg19_full" \
                  -q 0.01 --keep-dup all -B \
                  > "/chromatin/qc/${sample}.macs3.stdout.log" \
                  2> "/chromatin/qc/${sample}.macs3.stderr.log"
                test -f "${sample}_hg19_full_peaks.narrowPeak"
                cp "${sample}_hg19_full_peaks.narrowPeak" "/chromatin/results/"
                wc -l "${sample}_hg19_full_peaks.narrowPeak" \
                  > "/chromatin/results/${sample}.peak-count.txt"
                export_fragments "$sample"
                rm -f "${sample}.mapq30.bam" "${sample}.mapq30.bam.bai"
                df -h > "/chromatin/qc/${sample}.disk-after-peak-cleanup.txt"
              done < /chromatin/rows.tsv

              rm -f "${input_sample}.mapq30.bam" "${input_sample}.mapq30.bam.bai"
              sha256sum /chromatin/results/* > /chromatin/qc/results.SHA256SUMS
            '

      - name: Record condition provenance
        if: always()
        run: |
          set +e
          mkdir -p chromatin/qc
          df -h > chromatin/qc/final-disk.txt
          du -sh chromatin > chromatin/qc/final-working-set.txt 2>/dev/null || true
          cat > chromatin/qc/PROVENANCE.txt <<EOF
          condition=${CONDITION}
          source_scope=complete published paired FASTQ archives for two H3K9ac replicates, two H3K56ac replicates and one matched INPUT
          source_integrity=published MD5 verified on exact compressed bytes before successful completion
          trimming=fastp streamed, no raw or trimmed FASTQ staging
          reference=complete UCSC hg19, source MD5 verified
          aligner=Bowtie2 --very-sensitive
          duplicate_removal=samtools fixmate + coordinate sort + markdup -r within each biological library
          mapq_threshold=30
          peak_caller=MACS3 BAMPE q<=0.01 with matched condition INPUT
          retained_fragment_evidence=one BED row per MAPQ30 proper-pair read1 fragment; sufficient for exact later overlap counting against a fixed peak universe
          note=pilot architecture avoids repeated INPUT download within a condition and deletes heavy BAM intermediates after compact fragment evidence and peaks are validated
          EOF

      - name: Upload compact chromatin condition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty1-chromatin-WT-pilot
          path: |
            chromatin/results
            chromatin/qc
            chromatin/condition.json
            chromatin/rows.tsv
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
