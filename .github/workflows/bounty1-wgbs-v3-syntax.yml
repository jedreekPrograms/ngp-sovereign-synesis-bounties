name: Bounty 1 WGBS v3 syntax

on:
  push:
    branches:
      - bounty-1-real-pipeline
    paths:
      - '.github/workflows/bounty1-wgbs-cohort-v3.yml'
      - '.github/workflows/bounty1-wgbs-v3-syntax.yml'
  pull_request:
    paths:
      - '.github/workflows/bounty1-wgbs-cohort-v3.yml'
      - '.github/workflows/bounty1-wgbs-v3-syntax.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate checkpoint workflow invariants
        run: |
          set -euo pipefail
          f=.github/workflows/bounty1-wgbs-cohort-v3.yml
          test -s "$f"
          grep -Fq 'actions: read' "$f"
          grep -Fq 'Restore newest valid checkpoint from this or an older run' "$f"
          grep -Fq 'bounty1-wgbs-v3-${SAMPLE_ID}-candidate' "$f"
          grep -Fq 'bounty1-wgbs-v3-${SAMPLE_ID}-bam' "$f"
          grep -Fq 'bounty1-wgbs-v3-${SAMPLE_ID}-coverage' "$f"
          grep -Fq 'sha256sum -c SHA256SUMS' "$f"
          grep -Fq 'source_r1_md5' "$f"
          grep -Fq 'final_reference' "$f"
          echo 'checkpoint workflow invariants OK'
