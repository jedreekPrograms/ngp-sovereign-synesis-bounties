name: Bounty 1 WGBS prefilter benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bounty1-wgbs-prefilter-benchmark.yml'
      - 'bounty1/Dockerfile'
      - 'bounty1/bin/benchmark_wgbs_prefilters.sh'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load pinned analysis image from shared cache
        uses: docker/build-push-action@v6
        with:
          context: bounty1
          load: true
          pull: true
          tags: bounty1-pace:prefilter-bench
          cache-from: type=gha,scope=bounty1-docker
          cache-to: type=gha,mode=max,scope=bounty1-docker

      - name: Stream 200k real WT pairs and prepare narrow PACE reference
        run: |
          set -euo pipefail
          mkdir -p bench/ref bench/raw bench/out
          python3 - <<'PY'
          import gzip, urllib.request
          from pathlib import Path

          urls = {
              'R1': 'https://download.cncb.ac.cn/gsa-human/HRA003336/HRR1202754/HRR1202754_f1.fq.gz',
              'R2': 'https://download.cncb.ac.cn/gsa-human/HRA003336/HRR1202754/HRR1202754_r2.fq.gz',
          }
          n = 200_000
          for mate, url in urls.items():
              out = Path(f'bench/raw/WT_rep1.{mate}.fastq.gz')
              req = urllib.request.Request(url, headers={'User-Agent': 'bounty1-prefilter-benchmark/1'})
              with urllib.request.urlopen(req, timeout=60) as resp, gzip.GzipFile(fileobj=resp) as src, gzip.open(out, 'wb', compresslevel=1) as dst:
                  for _ in range(n):
                      rec = [src.readline() for _ in range(4)]
                      if any(not x for x in rec):
                          raise SystemExit(f'{mate}: source ended before {n} records')
                      dst.writelines(rec)
          PY
          gzip -t bench/raw/WT_rep1.R1.fastq.gz
          gzip -t bench/raw/WT_rep1.R2.fastq.gz

          curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors \
            -o bench/ref/hg19.fa.gz \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/hg19.fa.gz
          curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors \
            -o bench/ref/md5sum.txt \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/md5sum.txt
          (
            cd bench/ref
            grep -E '[[:space:]]hg19.fa.gz$' md5sum.txt > hg19.fa.gz.md5
            md5sum --check hg19.fa.gz.md5
            gzip -d hg19.fa.gz
          )

          docker run --rm -v "$PWD/bench:/bench" bounty1-pace:prefilter-bench bash -lc '
            set -euo pipefail
            samtools faidx /bench/ref/hg19.fa
            Rscript /work/bin/export_pace_regions.R --output /bench/ref/pace.bed --flank 500
          '

          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          src=Path('bench/ref/pace.bed'); dst=Path('bench/ref/pace-screen.merged.bed')
          by=defaultdict(list)
          for line in src.read_text().splitlines():
              if not line or line.startswith('#'): continue
              f=line.split('\t'); by[f[0]].append((max(0,int(f[1])-500),int(f[2])+500))
          with dst.open('w') as out:
              for chrom in sorted(by):
                  merged=[]
                  for s,e in sorted(by[chrom]):
                      if not merged or s>merged[-1][1]: merged.append([s,e])
                      else: merged[-1][1]=max(merged[-1][1],e)
                  for s,e in merged: out.write(f'{chrom}\t{s}\t{e}\n')
          PY

          docker run --rm -v "$PWD/bench:/bench" bounty1-pace:prefilter-bench bash -lc '
            set -euo pipefail
            : > /bench/ref/pace-screen.fa
            while read -r chrom start end; do
              samtools faidx /bench/ref/hg19.fa "${chrom}:$((start+1))-${end}"
            done < /bench/ref/pace-screen.merged.bed >> /bench/ref/pace-screen.fa
            samtools faidx /bench/ref/pace-screen.fa
            bwameth.py index /bench/ref/pace-screen.fa
            mkdir -p /bench/ref/bismark_genome
            cp /bench/ref/pace-screen.fa /bench/ref/bismark_genome/pace-screen.fa
            bismark_genome_preparation --bowtie2 /bench/ref/bismark_genome
          '

      - name: Fastp once for benchmark input
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/bench:/bench" bounty1-pace:prefilter-bench bash -lc '
            set -euo pipefail
            fastp -i /bench/raw/WT_rep1.R1.fastq.gz -I /bench/raw/WT_rep1.R2.fastq.gz \
              -o /bench/raw/WT_rep1.clean.R1.fastq.gz -O /bench/raw/WT_rep1.clean.R2.fastq.gz \
              --thread 2 --json /bench/out/fastp.json --html /bench/out/fastp.html
          '

      - name: Benchmark current bwameth candidate screen
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker run --rm -v "$PWD/bench:/bench" bounty1-pace:prefilter-bench bash -lc '
            set -euo pipefail
            cd /bench/out
            python3 /work/bin/stream_interleaved_fastq.py \
              --r1-source /bench/raw/WT_rep1.clean.R1.fastq.gz \
              --r2-source /bench/raw/WT_rep1.clean.R2.fastq.gz | \
            bwameth.py --threads 4 --interleaved --reference /bench/ref/pace-screen.fa /dev/stdin 2> bwameth.stderr.log | \
            samtools view -h -F SECONDARY,SUPPLEMENTARY -e "!(flag.unmap && flag.munmap)" - | \
            samtools view -b -o bwameth.candidates.bam -
            samtools view bwameth.candidates.bam | cut -f1 | sort -u > bwameth.names.txt
          '
          end=$(date +%s)
          echo $((end-start)) > bench/out/bwameth.seconds.txt

      - name: Benchmark permissive Bismark single-mate screen
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker run --rm -v "$PWD/bench:/bench" bounty1-pace:prefilter-bench bash -lc '
            set -euo pipefail
            cd /bench/out
            rm -f bismark.names.txt
            for mate in R1 R2; do
              mkdir -p "bismark_${mate}"
              bismark --genome /bench/ref/bismark_genome \
                --bowtie2 --non_directional -n 1 -l 15 --score_min L,0,-0.6 \
                -p 4 --bam --temp_dir "bismark_${mate}/tmp" --output_dir "bismark_${mate}" \
                "/bench/raw/WT_rep1.clean.${mate}.fastq.gz"
              bam=$(find "bismark_${mate}" -maxdepth 1 -type f -name "*.bam" | head -1)
              test -n "$bam" -a -s "$bam"
              samtools view -F 2308 "$bam" | cut -f1 >> bismark.names.txt
            done
            sort -u -o bismark.names.txt bismark.names.txt
          '
          end=$(date +%s)
          echo $((end-start)) > bench/out/bismark.seconds.txt

      - name: Benchmark permissive BSMAP single-mate screen
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker run --rm -v "$PWD/bench:/bench" bounty1-pace:prefilter-bench bash -lc '
            set -euo pipefail
            cd /bench/out
            rm -f bsmap.names.txt bsmap.R1.names.txt bsmap.R2.names.txt bsmap.*.sam bsmap.*.stderr.log bsmap.which.log
            # BSMAP 2.90 predates modern samtools. Keep it isolated from the
            # samtools parser: write SAM to disk and extract mapped qnames with
            # a format-stable Python parser. Alignment parameters are unchanged.
            micromamba run -n bsmap which bsmap > bsmap.which.log 2>&1
            for mate in R1 R2; do
              : > "bsmap.${mate}.stderr.log"
              micromamba run -n bsmap bsmap \
                -a "/bench/raw/WT_rep1.clean.${mate}.fastq.gz" \
                -d /bench/ref/pace-screen.fa \
                -o "/bench/out/bsmap.${mate}.sam" \
                -p 2 -3 -n 1 -s 12 -v 0.12 -g 3 -r 1 \
                2> "bsmap.${mate}.stderr.log"
              test -s "bsmap.${mate}.sam"
              python3 -c "import re,sys; rows=[l.rstrip(chr(10)).split(chr(9)) for l in open(sys.argv[1], encoding=chr(117)+chr(116)+chr(102)+chr(45)+chr(56)) if l and not l.startswith(chr(64))]; assert rows and all(len(f)>=11 for f in rows), chr(105)+chr(110)+chr(118)+chr(97)+chr(108)+chr(105)+chr(100)+chr(32)+chr(66)+chr(83)+chr(77)+chr(65)+chr(80)+chr(32)+chr(83)+chr(65)+chr(77); seen=sorted({re.sub(r\"/[12]$\", \"\", f[0]) for f in rows if not (int(f[1]) & 4)}); assert seen, chr(110)+chr(111)+chr(32)+chr(109)+chr(97)+chr(112)+chr(112)+chr(101)+chr(100)+chr(32)+chr(66)+chr(83)+chr(77)+chr(65)+chr(80)+chr(32)+chr(114)+chr(101)+chr(97)+chr(100)+chr(115); open(sys.argv[2], chr(119), encoding=chr(117)+chr(116)+chr(102)+chr(45)+chr(56)).write(chr(10).join(seen)+chr(10))" "bsmap.${mate}.sam" "bsmap.${mate}.names.txt"
              rm -f "bsmap.${mate}.sam"
              test -s "bsmap.${mate}.names.txt"
            done
            sort -u bsmap.R1.names.txt bsmap.R2.names.txt > bsmap.names.txt
            test -s bsmap.names.txt
          '
          end=$(date +%s)
          echo $((end-start)) > bench/out/bsmap.seconds.txt

      - name: Require candidate supersets and summarize
        run: |
          set -euo pipefail
          comm -23 bench/out/bwameth.names.txt bench/out/bismark.names.txt > bench/out/bwameth-missed-by-bismark.txt
          comm -23 bench/out/bwameth.names.txt bench/out/bsmap.names.txt > bench/out/bwameth-missed-by-bsmap.txt
          bw=$(wc -l < bench/out/bwameth.names.txt)
          bi=$(wc -l < bench/out/bismark.names.txt)
          bs=$(wc -l < bench/out/bsmap.names.txt)
          bimiss=$(wc -l < bench/out/bwameth-missed-by-bismark.txt)
          bsmiss=$(wc -l < bench/out/bwameth-missed-by-bsmap.txt)
          bwsec=$(cat bench/out/bwameth.seconds.txt)
          bisec=$(cat bench/out/bismark.seconds.txt)
          bssec=$(cat bench/out/bsmap.seconds.txt)
          printf 'reads_per_mate=200000\nbwameth_candidate_names=%s\nbismark_candidate_names=%s\nbsmap_candidate_names=%s\nbwameth_missed_by_bismark=%s\nbwameth_missed_by_bsmap=%s\nbwameth_seconds=%s\nbismark_seconds=%s\nbsmap_seconds=%s\n' \
            "$bw" "$bi" "$bs" "$bimiss" "$bsmiss" "$bwsec" "$bisec" "$bssec" | tee bench/out/summary.txt
          test "$bimiss" -eq 0
          test "$bsmiss" -eq 0

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty1-wgbs-prefilter-benchmark
          path: |
            bench/out/summary.txt
            bench/out/*.seconds.txt
            bench/out/*missed*.txt
            bench/out/*.stderr.log
            bench/out/bsmap.which.log
          if-no-files-found: warn
          retention-days: 14
