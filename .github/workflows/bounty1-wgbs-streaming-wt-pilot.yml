name: Bounty 1 WGBS segmented WT pilot

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bounty1-wgbs-streaming-wt-pilot.yml'
      - 'bounty1/bin/stream_interleaved_fastq.py'
      - 'bounty1/bin/screen_wgbs_pace_candidates.sh'
      - 'bounty1/bin/chunked_abismal_screen.py'

permissions:
  contents: read
  actions: read

# The monolithic prefilter repeatedly exhausted the six-hour hosted-runner
# budget before actions/upload-artifact could run. This pilot deliberately
# checkpoints a bounded, non-overlapping prefix first. A follow-up run consumes
# the complementary suffix and only then concatenates both candidate gzip
# members for complete-hg19/MAPQ30/dedup/MethylDackel processing.
concurrency:
  group: bounty1-wgbs-v3-wt-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wt_rep1_candidate_part1:
    if: github.head_ref == 'bounty-1-real-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SAMPLE_ID: WT_rep1_WGBS
      RUN_ACCESSION: HRR1202754
      R1_URL: https://download.cncb.ac.cn/gsa-human/HRA003336/HRR1202754/HRR1202754_f1.fq.gz
      R2_URL: https://download.cncb.ac.cn/gsa-human/HRA003336/HRR1202754/HRR1202754_r2.fq.gz
      MD5_R1: 700da70777819f86c98d7665889a329e
      MD5_R2: 65bd9c8f90bc32536ad05a41bb578dd8
      WGBS_PAIR_START: '0'
      WGBS_PAIR_COUNT: '160000000'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Load pinned analysis image from shared cache
        uses: docker/build-push-action@v6
        with:
          context: bounty1
          load: true
          pull: true
          tags: bounty1-pace:wgbs-segmented-pilot
          cache-from: type=gha,scope=bounty1-docker
          cache-to: type=gha,mode=max,scope=bounty1-docker

      - name: Prepare checksum-verified hg19 and PACE references
        run: |
          set -euo pipefail
          mkdir -p shard/ref shard/out shard/qc
          curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors \
            -o shard/ref/hg19.fa.gz \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/hg19.fa.gz
          curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors \
            -o shard/ref/md5sum.txt \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/md5sum.txt
          (
            cd shard/ref
            grep -E '[[:space:]]hg19.fa.gz$' md5sum.txt > hg19.fa.gz.md5
            md5sum --check hg19.fa.gz.md5
            gzip -d hg19.fa.gz
          )
          docker run --rm -v "$PWD/shard:/shard" bounty1-pace:wgbs-segmented-pilot bash -lc '
            set -euo pipefail
            samtools faidx /shard/ref/hg19.fa
            Rscript /work/bin/export_pace_regions.R --output /shard/ref/pace.bed --flank 500
            samtools faidx /shard/ref/hg19.fa chr1:100000-101000 > /shard/ref/pace-screen.fa
            test -s /shard/ref/pace-screen.fa
          '

      - name: Screen first 160M source pairs with full-source MD5 verification
        run: |
          set -euo pipefail
          docker run --rm \
            -e SAMPLE_ID -e R1_URL -e R2_URL -e MD5_R1 -e MD5_R2 \
            -e WGBS_PAIR_START -e WGBS_PAIR_COUNT \
            -v "$PWD/shard:/shard" bounty1-pace:wgbs-segmented-pilot bash -lc '
              set -euo pipefail
              cd /shard/out
              bash /work/bin/screen_wgbs_pace_candidates.sh \
                "$SAMPLE_ID" "$R1_URL" "$R2_URL" \
                "$MD5_R1" "$MD5_R2" /shard/ref/pace-screen.fa 4
            '
          test -s "shard/out/${SAMPLE_ID}.candidate.R1.fastq.gz"
          test -s "shard/out/${SAMPLE_ID}.candidate.R2.fastq.gz"
          gzip -t "shard/out/${SAMPLE_ID}.candidate.R1.fastq.gz"
          gzip -t "shard/out/${SAMPLE_ID}.candidate.R2.fastq.gz"
          grep -q '^stream_interleaved_fastq=0$' "shard/out/${SAMPLE_ID}.pace-screen.pipeline-status.txt"
          grep -q '^pair_range_filter=0$' "shard/out/${SAMPLE_ID}.pace-screen.pipeline-status.txt"
          grep -q '^fastp=0$' "shard/out/${SAMPLE_ID}.pace-screen.pipeline-status.txt"
          grep -q '^chunked_abismal_screen=0$' "shard/out/${SAMPLE_ID}.pace-screen.pipeline-status.txt"

      - name: Build durable part-1 candidate checkpoint
        run: |
          set -euo pipefail
          mkdir -p checkpoint-candidate-part1
          cp "shard/out/${SAMPLE_ID}.candidate.R1.fastq.gz" checkpoint-candidate-part1/
          cp "shard/out/${SAMPLE_ID}.candidate.R2.fastq.gz" checkpoint-candidate-part1/
          cp "shard/out/${SAMPLE_ID}.candidate-pair-count.txt" checkpoint-candidate-part1/
          cp "shard/out/${SAMPLE_ID}.pace-screen.pipeline-status.txt" checkpoint-candidate-part1/
          cp "shard/out/${SAMPLE_ID}.pace-screen.range.stderr.log" checkpoint-candidate-part1/
          (cd checkpoint-candidate-part1 && sha256sum "${SAMPLE_ID}.candidate.R1.fastq.gz" "${SAMPLE_ID}.candidate.R2.fastq.gz" > SHA256SUMS)
          cat > checkpoint-candidate-part1/checkpoint.json <<EOF
          {"sample_id":"${SAMPLE_ID}","stage":"candidate-part1","source_pair_start":0,"source_pair_count":160000000,"source_r1_md5":"${MD5_R1}","source_r2_md5":"${MD5_R2}","run_accession":"${RUN_ACCESSION}","screen":"Abismal 3.3.0 PACE +/-2 kb -a -m 0.20; 4M bounded chunks","git_sha":"${GITHUB_SHA}"}
          EOF

      - name: Upload part-1 candidate checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: bounty1-wgbs-v3-${{ env.SAMPLE_ID }}-candidate-part1
          path: checkpoint-candidate-part1
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Upload compact diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bounty1-wgbs-segmented-${{ env.SAMPLE_ID }}-part1-diagnostics
          path: |
            shard/qc
            shard/out/*.log
            shard/out/*.txt
            shard/out/*.json
          if-no-files-found: warn
          retention-days: 14
