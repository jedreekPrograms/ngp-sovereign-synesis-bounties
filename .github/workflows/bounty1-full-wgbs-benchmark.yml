name: Bounty 1 full-source WGBS benchmark

on:
  push:
    branches:
      - bounty-1-real-pipeline
    paths:
      - '.github/workflows/bounty1-full-wgbs-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: bounty1-full-wgbs-benchmark
  cancel-in-progress: false

jobs:
  wt-rep1-full-source:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Load pinned analysis image from shared cache
        uses: docker/build-push-action@v6
        with:
          context: bounty1
          load: true
          pull: true
          tags: bounty1-pace:full-benchmark
          cache-from: type=gha,scope=bounty1-docker
          cache-to: type=gha,mode=max,scope=bounty1-docker

      - name: Prepare full hg19 bwa-meth reference and PACE windows
        run: |
          set -euo pipefail
          mkdir -p full-benchmark/ref full-benchmark/out full-benchmark/qc
          curl -fsSL --retry 5 --retry-delay 5 \
            -o full-benchmark/ref/hg19.fa.gz \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/hg19.fa.gz
          curl -fsSL --retry 5 --retry-delay 5 \
            -o full-benchmark/ref/md5sum.txt \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/md5sum.txt
          (
            cd full-benchmark/ref
            grep -E '[[:space:]]hg19.fa.gz$' md5sum.txt > hg19.fa.gz.md5
            md5sum --check hg19.fa.gz.md5
            gzip -d hg19.fa.gz
          )
          docker run --rm -v "$PWD/full-benchmark:/bench" bounty1-pace:full-benchmark bash -lc '
            set -euo pipefail
            samtools faidx /bench/ref/hg19.fa
            bwameth.py index /bench/ref/hg19.fa
            Rscript /work/bin/export_pace_regions.R --output /bench/ref/pace.bed --flank 500
            test -s /bench/ref/pace.bed
          '
          df -h > full-benchmark/qc/disk-after-reference.txt
          du -sh full-benchmark/ref > full-benchmark/qc/reference-size.txt

      - name: Stream complete WT rep1 WGBS source through production path
        run: |
          set -euo pipefail
          START=$(date +%s)
          docker run --rm -v "$PWD/full-benchmark:/bench" bounty1-pace:full-benchmark bash -lc '
            set -euo pipefail
            cd /bench/out
            bash /work/bin/stream_wgbs_bwameth.sh \
              WT_rep1_WGBS \
              https://download.cncb.ac.cn/gsa-human/HRA003336/HRR1202754/HRR1202754_f1.fq.gz \
              https://download.cncb.ac.cn/gsa-human/HRA003336/HRR1202754/HRR1202754_r2.fq.gz \
              700da70777819f86c98d7665889a329e \
              65bd9c8f90bc32536ad05a41bb578dd8 \
              /bench/ref/hg19.fa /bench/ref/pace.bed 30 4
          '
          END=$(date +%s)
          echo $((END-START)) > full-benchmark/qc/alignment-wall-seconds.txt
          test -s full-benchmark/out/WT_rep1_WGBS.mapq30.pace-targets.deduplicated.bam
          test -s full-benchmark/out/WT_rep1_WGBS.mapq30.pace-targets.deduplicated.bam.bai
          cp full-benchmark/out/WT_rep1_WGBS.source-stream.log full-benchmark/qc/
          cp full-benchmark/out/WT_rep1_WGBS.fastp.json full-benchmark/qc/
          cp full-benchmark/out/WT_rep1_WGBS.pace-targets.flagstat.txt full-benchmark/qc/
          df -h > full-benchmark/qc/disk-after-alignment.txt
          du -sh full-benchmark/out > full-benchmark/qc/output-size-after-alignment.txt

      - name: Extract full-source PACE-region CpG methylation
        run: |
          set -euo pipefail
          START=$(date +%s)
          docker run --rm -v "$PWD/full-benchmark:/bench" bounty1-pace:full-benchmark bash -lc '
            set -euo pipefail
            cd /bench/out
            micromamba run -n methyldackel MethylDackel extract \
              -q 30 -p 5 --minDepth 1 -@ 2 \
              /bench/ref/hg19.fa \
              WT_rep1_WGBS.mapq30.pace-targets.deduplicated.bam \
              -o WT_rep1_WGBS.methyldackel
            test -s WT_rep1_WGBS.methyldackel_CpG.bedGraph
            python3 /work/bin/methyldackel_to_bismark.py \
              --input WT_rep1_WGBS.methyldackel_CpG.bedGraph \
              --output /bench/qc/WT_rep1_WGBS.bismark.cov.gz
            gzip -t /bench/qc/WT_rep1_WGBS.bismark.cov.gz
            test "$(gzip -cd /bench/qc/WT_rep1_WGBS.bismark.cov.gz | wc -l)" -gt 0
          '
          END=$(date +%s)
          echo $((END-START)) > full-benchmark/qc/methylation-wall-seconds.txt
          gzip -cd full-benchmark/qc/WT_rep1_WGBS.bismark.cov.gz | wc -l > full-benchmark/qc/coverage-row-count.txt

      - name: Record benchmark evidence
        if: always()
        run: |
          set +e
          df -h > full-benchmark/qc/final-disk.txt
          du -sh full-benchmark 2>/dev/null > full-benchmark/qc/final-working-set.txt
          cat > full-benchmark/qc/README.txt <<'EOF'
          FULL-SOURCE WGBS BENCHMARK
          ==========================
          Source: HRA003336 / HRR1202754 / WT_rep1_WGBS, both complete FASTQ mates.
          Source integrity: archive MD5 values are validated by stream_interleaved_fastq.py.
          Reference: complete UCSC hg19 FASTA, checksum-validated against UCSC md5sum.txt.
          Processing: full read stream -> fastp -> bwa-meth -> MAPQ >=30 -> official
          DunedinPACE probe windows -> duplicate removal -> MethylDackel -> Bismark-like coverage.

          This job benchmarks one complete biological WGBS library. It is not itself the
          final multi-sample biological analysis.
          EOF

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty1-full-wgbs-benchmark
          path: full-benchmark/qc
          if-no-files-found: warn
          retention-days: 14
