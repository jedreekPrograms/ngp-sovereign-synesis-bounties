name: Bounty 1 pipeline checks

on:
  pull_request:
    paths:
      - 'bounty1/**'
      - '.github/workflows/bounty1-unit.yml'
  push:
    paths:
      - 'bounty1/**'
      - '.github/workflows/bounty1-unit.yml'

concurrency:
  group: bounty1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest scipy
      - run: pytest bounty1/tests -q
      - run: python bounty1/bin/validate_samplesheet.py bounty1/resources/samplesheet.csv --controls-sheet bounty1/resources/chip_inputs.csv

  data-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: HEAD-check all production FASTQ URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import re
          import subprocess
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          urls = []
          sheets = (
              Path('bounty1/resources/samplesheet.csv'),
              Path('bounty1/resources/chip_inputs.csv'),
              Path('bounty1/resources/sirt6_cutrun.csv'),
          )
          for sheet in sheets:
              with sheet.open(newline='', encoding='utf-8') as fh:
                  for row in csv.DictReader(fh):
                      for key in ('fastq_1', 'fastq_2'):
                          if row.get(key):
                              urls.append((row['sample_id'], key, row[key]))

          def probe(item):
              sample, mate, url = item
              p = subprocess.run(
                  ['curl', '--head', '--location', '--silent', '--show-error',
                   '--max-time', '25', '--retry', '2', url],
                  text=True, capture_output=True, check=False,
              )
              codes = re.findall(r'(?im)^HTTP/\S+\s+(\d{3})', p.stdout)
              lengths = [int(x) for x in re.findall(r'(?im)^content-length:\s*(\d+)\s*$', p.stdout)]
              return sample, mate, url, (int(codes[-1]) if codes else None), (lengths[-1] if lengths else None), p.stderr.strip()

          results = []
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = [pool.submit(probe, item) for item in urls]
              for future in as_completed(futures):
                  results.append(future.result())

          failures = []
          known_total = 0
          known_count = 0
          for sample, mate, url, status, size, err in sorted(results):
              if size is not None:
                  known_total += size
                  known_count += 1
              if status is None or not (200 <= status < 400):
                  failures.append((sample, mate, status, err, url))

          print(f'FASTQ URLs checked: {len(results)}')
          print(f'HTTP failures: {len(failures)}')
          print(f'URLs exposing Content-Length: {known_count}/{len(results)}')
          print(f'Known compressed total: {known_total / 1024**3:.2f} GiB')
          for failure in failures:
              print('FAIL:', failure)
          if failures:
              raise SystemExit(1)
          PY

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build analysis image
        run: docker build --pull -t bounty1-pace:ci bounty1
      - name: Validate production metadata inside image
        run: docker run --rm bounty1-pace:ci python bin/validate_samplesheet.py resources/samplesheet.csv --controls-sheet resources/chip_inputs.csv
      - name: Verify upstream DunedinPACE model is installed
        run: |
          docker run --rm bounty1-pace:ci R -q -e "library(DunedinPACE); stopifnot(length(mPACE_Models\$model_names) > 0); stopifnot(all(is.finite(unlist(mPACE_Models\$model_intercept)))); print(mPACE_Models\$model_intercept)"
      - name: Execute streaming + MD5 helper on real gzip FASTQ bytes
        run: |
          docker run --rm bounty1-pace:ci bash -lc '
            set -euo pipefail
            tmp=$(mktemp -d)
            cd "$tmp"
            printf "@read1/1\nACGTACGTACGTACGTACGT\n+\nIIIIIIIIIIIIIIIIIIII\n" | gzip -c > R1.fq.gz
            printf "@read1/2\nTGCATGCATGCATGCATGCA\n+\nIIIIIIIIIIIIIIIIIIII\n" | gzip -c > R2.fq.gz
            m1=$(md5sum R1.fq.gz | awk "{print \$1}")
            m2=$(md5sum R2.fq.gz | awk "{print \$1}")
            bash /work/bin/stream_fastp.sh smoke R1.fq.gz R2.fq.gz "$m1" "$m2" 2
            gzip -t smoke.trimmed.R1.fastq.gz
            gzip -t smoke.trimmed.R2.fastq.gz
            test -s smoke.fastp.json
            test -s smoke.fastp.html
          '
      - name: Smoke-test complete Nextflow graph without real data
        run: |
          docker run --rm bounty1-pace:ci \
            nextflow run main.nf -stub-run -ansi-log false \
            --samplesheet tests/fixtures/smoke_samplesheet.csv \
            --controls_sheet tests/fixtures/smoke_controls.csv \
            --bowtie2_index /tmp/stub/hg19 \
            --bismark_index /tmp/stub \
            --outdir /tmp/bounty1-smoke
