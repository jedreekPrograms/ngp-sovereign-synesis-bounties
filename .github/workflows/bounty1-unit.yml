name: Bounty 1 pipeline checks

on:
  pull_request:
    paths:
      - 'bounty1/**'
      - '.github/workflows/bounty1-unit.yml'
  push:
    paths:
      - 'bounty1/**'
      - '.github/workflows/bounty1-unit.yml'

concurrency:
  group: bounty1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest scipy
      - run: pytest bounty1/tests -q
      - run: python bounty1/bin/validate_samplesheet.py bounty1/resources/samplesheet.csv --controls-sheet bounty1/resources/chip_inputs.csv

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static-analysis tools
        run: pip install ruff bandit
      - name: Ruff correctness checks
        run: ruff check --select F,E9 bounty1/bin bounty1/tests
      - name: Bandit medium/high findings
        run: bandit -q -ll -r bounty1/bin

  data-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe all production FASTQ URLs and rank pilot inputs
        run: |
          python bounty1/bin/probe_data_sizes.py \
            --sheet bounty1/resources/samplesheet.csv \
            --sheet bounty1/resources/chip_inputs.csv \
            --sheet bounty1/resources/sirt6_cutrun.csv \
            --output bounty1-data-sizes.tsv
      - name: Upload reproducible data-size inventory
        uses: actions/upload-artifact@v4
        with:
          name: bounty1-data-sizes
          path: bounty1-data-sizes.tsv
          if-no-files-found: error

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build analysis image with shared GHA cache
        uses: docker/build-push-action@v6
        with:
          context: bounty1
          load: true
          pull: true
          tags: bounty1-pace:ci
          cache-from: type=gha,scope=bounty1-docker
          cache-to: type=gha,mode=max,scope=bounty1-docker
      - name: Validate production metadata inside image
        run: docker run --rm bounty1-pace:ci python bin/validate_samplesheet.py resources/samplesheet.csv --controls-sheet resources/chip_inputs.csv
      - name: Verify upstream DunedinPACE model is installed
        run: |
          docker run --rm bounty1-pace:ci R -q -e "library(DunedinPACE); model_probes <- unique(unlist(getRequiredProbes(FALSE))); background <- unique(unlist(getRequiredProbes(TRUE))); stopifnot(length(mPACE_Models\$model_names) > 0); stopifnot(all(is.finite(unlist(mPACE_Models\$model_intercept)))); stopifnot(all(model_probes %in% background)); print(mPACE_Models\$model_intercept)"
      - name: Execute streaming + MD5 helper on real gzip FASTQ bytes
        run: |
          docker run --rm bounty1-pace:ci bash -lc '
            set -euo pipefail
            tmp=$(mktemp -d)
            cd "$tmp"
            printf "@read1/1\nACGTACGTACGTACGTACGT\n+\nIIIIIIIIIIIIIIIIIIII\n" | gzip -c > R1.fq.gz
            printf "@read1/2\nTGCATGCATGCATGCATGCA\n+\nIIIIIIIIIIIIIIIIIIII\n" | gzip -c > R2.fq.gz
            m1=$(md5sum R1.fq.gz | awk "{print \$1}")
            m2=$(md5sum R2.fq.gz | awk "{print \$1}")
            bash /work/bin/stream_fastp.sh smoke R1.fq.gz R2.fq.gz "$m1" "$m2" 2
            gzip -t smoke.trimmed.R1.fastq.gz
            gzip -t smoke.trimmed.R2.fastq.gz
            test -s smoke.fastp.json
            test -s smoke.fastp.html
          '
      - name: Smoke-test complete Nextflow graph without real data
        run: |
          docker run --rm bounty1-pace:ci \
            nextflow run main.nf -profile ci -stub-run -ansi-log false \
            --samplesheet tests/fixtures/smoke_samplesheet.csv \
            --controls_sheet tests/fixtures/smoke_controls.csv \
            --cutrun_sheet tests/fixtures/smoke_cutrun.csv \
            --bowtie2_index /tmp/stub/hg19 \
            --bismark_index /tmp/stub \
            --outdir /tmp/bounty1-smoke
