name: Bounty 1 WGBS cohort shards

on:
  workflow_dispatch:
    inputs:
      sample_regex:
        description: Regex selecting WGBS sample IDs from resources/samplesheet.csv
        required: true
        default: '^(WT|SIRT[1-7])_rep[12]_WGBS$'
      max_parallel:
        description: Maximum number of WGBS shards to run concurrently
        required: true
        default: '2'

concurrency:
  group: bounty1-wgbs-cohort-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Build WGBS matrix from validated production metadata
        env:
          SAMPLE_REGEX: ${{ inputs.sample_regex }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json, os, re
          pattern = re.compile(os.environ['SAMPLE_REGEX'])
          rows = []
          with open('bounty1/resources/samplesheet.csv', newline='', encoding='utf-8') as fh:
              for row in csv.DictReader(fh):
                  if row['assay'] != 'WGBS' or not pattern.search(row['sample_id']):
                      continue
                  rows.append({
                      'sample_id': row['sample_id'],
                      'condition': row['condition'],
                      'replicate': row['replicate'],
                      'r1': row['fastq_1'],
                      'r2': row['fastq_2'],
                      'md5_r1': row['read1_md5'],
                      'md5_r2': row['read2_md5'],
                      'run_accession': row['run_accession'],
                  })
          if not rows:
              raise SystemExit('sample_regex selected no WGBS rows')
          print('matrix=' + json.dumps({'include': rows}, separators=(',', ':')))
          print('count=' + str(len(rows)))
          PY

  wgbs:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load pinned analysis image from shared cache
        uses: docker/build-push-action@v6
        with:
          context: bounty1
          load: true
          pull: true
          tags: bounty1-pace:wgbs-cohort
          cache-from: type=gha,scope=bounty1-docker
          cache-to: type=gha,mode=max,scope=bounty1-docker

      - name: Prepare verified hg19 reference and official PACE windows
        run: |
          set -euo pipefail
          mkdir -p shard/ref shard/out shard/qc
          curl -fsSL --retry 5 --retry-delay 5 \
            -o shard/ref/hg19.fa.gz \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/hg19.fa.gz
          curl -fsSL --retry 5 --retry-delay 5 \
            -o shard/ref/md5sum.txt \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/md5sum.txt
          (
            cd shard/ref
            grep -E '[[:space:]]hg19.fa.gz$' md5sum.txt > hg19.fa.gz.md5
            md5sum --check hg19.fa.gz.md5
            gzip -d hg19.fa.gz
          )
          docker run --rm -v "$PWD/shard:/shard" bounty1-pace:wgbs-cohort bash -lc '
            set -euo pipefail
            samtools faidx /shard/ref/hg19.fa
            bwameth.py index /shard/ref/hg19.fa
            Rscript /work/bin/export_pace_regions.R --output /shard/ref/pace.bed --flank 500
            test -s /shard/ref/pace.bed
          '

      - name: Stream complete WGBS source through production PACE-target path
        env:
          SAMPLE_ID: ${{ matrix.sample_id }}
          R1: ${{ matrix.r1 }}
          R2: ${{ matrix.r2 }}
          MD5_R1: ${{ matrix.md5_r1 }}
          MD5_R2: ${{ matrix.md5_r2 }}
        run: |
          set -euo pipefail
          START=$(date +%s)
          docker run --rm \
            -e SAMPLE_ID -e R1 -e R2 -e MD5_R1 -e MD5_R2 \
            -e WGBS_SORT_MEM=256M \
            -v "$PWD/shard:/shard" \
            bounty1-pace:wgbs-cohort bash -lc '
              set -euo pipefail
              cd /shard/out
              bash /work/bin/stream_wgbs_bwameth.sh \
                "$SAMPLE_ID" "$R1" "$R2" "$MD5_R1" "$MD5_R2" \
                /shard/ref/hg19.fa /shard/ref/pace.bed 30 4
            '
          END=$(date +%s)
          echo $((END-START)) > "shard/qc/${SAMPLE_ID}.alignment-wall-seconds.txt"
          test -s "shard/out/${SAMPLE_ID}.mapq30.pace-targets.deduplicated.bam"
          test -s "shard/out/${SAMPLE_ID}.mapq30.pace-targets.deduplicated.bam.bai"

      - name: Extract PACE-region CpG methylation
        env:
          SAMPLE_ID: ${{ matrix.sample_id }}
        run: |
          set -euo pipefail
          docker run --rm -e SAMPLE_ID -v "$PWD/shard:/shard" bounty1-pace:wgbs-cohort bash -lc '
            set -euo pipefail
            cd /shard/out
            micromamba run -n methyldackel MethylDackel extract \
              -q 30 -p 5 --minDepth 1 -@ 2 \
              /shard/ref/hg19.fa \
              "${SAMPLE_ID}.mapq30.pace-targets.deduplicated.bam" \
              -o "${SAMPLE_ID}.methyldackel"
            test -s "${SAMPLE_ID}.methyldackel_CpG.bedGraph"
            python3 /work/bin/methyldackel_to_bismark.py \
              --input "${SAMPLE_ID}.methyldackel_CpG.bedGraph" \
              --output "/shard/qc/${SAMPLE_ID}.bismark.cov.gz"
            gzip -t "/shard/qc/${SAMPLE_ID}.bismark.cov.gz"
            test "$(gzip -cd "/shard/qc/${SAMPLE_ID}.bismark.cov.gz" | wc -l)" -gt 0
          '
          gzip -cd "shard/qc/${SAMPLE_ID}.bismark.cov.gz" | wc -l > "shard/qc/${SAMPLE_ID}.coverage-row-count.txt"

      - name: Record shard provenance and diagnostics
        if: always()
        env:
          SAMPLE_ID: ${{ matrix.sample_id }}
          CONDITION: ${{ matrix.condition }}
          REPLICATE: ${{ matrix.replicate }}
          RUN_ACCESSION: ${{ matrix.run_accession }}
        run: |
          set +e
          mkdir -p shard/qc
          cp "shard/out/${SAMPLE_ID}.source-stream.log" shard/qc/ 2>/dev/null || true
          cp "shard/out/${SAMPLE_ID}.fastp.stderr.log" shard/qc/ 2>/dev/null || true
          cp "shard/out/${SAMPLE_ID}.bwameth.stderr.log" shard/qc/ 2>/dev/null || true
          cp "shard/out/${SAMPLE_ID}.samtools-view.stderr.log" shard/qc/ 2>/dev/null || true
          cp "shard/out/${SAMPLE_ID}.pipeline-status.txt" shard/qc/ 2>/dev/null || true
          cp "shard/out/${SAMPLE_ID}.fastp.json" shard/qc/ 2>/dev/null || true
          cp "shard/out/${SAMPLE_ID}.pace-targets.flagstat.txt" shard/qc/ 2>/dev/null || true
          df -h > "shard/qc/${SAMPLE_ID}.final-disk.txt"
          du -sh shard > "shard/qc/${SAMPLE_ID}.final-working-set.txt" 2>/dev/null || true
          cat > "shard/qc/${SAMPLE_ID}.provenance.txt" <<EOF
          sample_id=${SAMPLE_ID}
          condition=${CONDITION}
          replicate=${REPLICATE}
          run_accession=${RUN_ACCESSION}
          source_scope=complete paired FASTQ archives streamed from production metadata
          reference=UCSC hg19 checksum-verified
          mapq_threshold=30
          methylation_min_depth_raw=1
          final_dunedinpace_min_depth=6
          EOF

      - name: Upload WGBS shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty1-wgbs-${{ matrix.sample_id }}
          path: shard/qc
          if-no-files-found: error
          retention-days: 14

  pace:
    needs: [plan, wgbs]
    if: ${{ needs.wgbs.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bounty1-wgbs-*
          path: cohort-cov
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Load pinned analysis image from shared cache
        uses: docker/build-push-action@v6
        with:
          context: bounty1
          load: true
          pull: true
          tags: bounty1-pace:wgbs-cohort
          cache-from: type=gha,scope=bounty1-docker
          cache-to: type=gha,mode=max,scope=bounty1-docker
      - name: Compute measured DunedinPACE scores
        run: |
          set -euo pipefail
          test "$(find cohort-cov -name '*.bismark.cov.gz' | wc -l)" -ge 3
          docker run --rm \
            -v "$PWD/cohort-cov:/cohort:ro" \
            -v "$PWD:/repo" \
            bounty1-pace:wgbs-cohort bash -lc '
              set -euo pipefail
              Rscript /work/bin/compute_dunedinpace.R \
                --cov-dir /cohort \
                --scores /repo/dunedinpace_scores.csv \
                --qc /repo/pace_probe_qc.csv \
                --model-metadata /repo/pace_model_metadata.csv \
                --min-probe-fraction 0.80 \
                --min-depth 6
            '
          test -s dunedinpace_scores.csv
          test -s pace_probe_qc.csv
          test -s pace_model_metadata.csv
      - name: Upload measured DunedinPACE cohort outputs
        uses: actions/upload-artifact@v4
        with:
          name: bounty1-wgbs-cohort-pace
          path: |
            dunedinpace_scores.csv
            pace_probe_qc.csv
            pace_model_metadata.csv
          if-no-files-found: error
          retention-days: 30
