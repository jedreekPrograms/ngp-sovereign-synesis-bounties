name: Bounty 1 WGBS cohort v2

on:
  workflow_dispatch:
    inputs:
      sample_regex:
        description: Regex selecting WGBS sample IDs from resources/samplesheet.csv
        required: true
        default: '^(WT|SIRT[1-7])_rep[12]_WGBS$'
      max_parallel:
        description: Maximum number of WGBS samples to process concurrently
        required: true
        default: '4'
  push:
    branches:
      - bounty-1-real-pipeline
    paths:
      - 'bounty1/cohort-v2.trigger'

permissions:
  contents: read

# This group intentionally matches the legacy cohort workflow. Launching v2
# cancels the old, known-slow +/-10 kb cohort instead of leaving it to consume
# runners until its per-job timeout.
concurrency:
  group: bounty1-wgbs-cohort-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Build WGBS matrix from validated production metadata
        env:
          SAMPLE_REGEX: ${{ inputs.sample_regex || '^(WT|SIRT[1-7])_rep[12]_WGBS$' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json, os, re
          pattern = re.compile(os.environ['SAMPLE_REGEX'])
          rows = []
          with open('bounty1/resources/samplesheet.csv', newline='', encoding='utf-8') as fh:
              for row in csv.DictReader(fh):
                  if row['assay'] != 'WGBS' or not pattern.search(row['sample_id']):
                      continue
                  rows.append({
                      'sample_id': row['sample_id'],
                      'condition': row['condition'],
                      'replicate': row['replicate'],
                      'r1': row['fastq_1'],
                      'r2': row['fastq_2'],
                      'md5_r1': row['read1_md5'],
                      'md5_r2': row['read2_md5'],
                      'run_accession': row['run_accession'],
                  })
          if not rows:
              raise SystemExit('sample_regex selected no WGBS rows')
          print('matrix=' + json.dumps({'include': rows}, separators=(',', ':')))
          print('count=' + str(len(rows)))
          PY

  wgbs:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '4') }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Load pinned analysis image from shared cache
        uses: docker/build-push-action@v6
        with:
          context: bounty1
          load: true
          pull: true
          tags: bounty1-pace:wgbs-cohort-v2
          cache-from: type=gha,scope=bounty1-docker
          cache-to: type=gha,mode=max,scope=bounty1-docker

      - name: Prepare verified hg19, narrow PACE screen and complete FASTQs
        env:
          SAMPLE_ID: ${{ matrix.sample_id }}
          R1_URL: ${{ matrix.r1 }}
          R2_URL: ${{ matrix.r2 }}
          MD5_R1: ${{ matrix.md5_r1 }}
          MD5_R2: ${{ matrix.md5_r2 }}
        run: |
          set -euo pipefail
          mkdir -p shard/ref shard/raw shard/out shard/qc

          prepare_reference() {
            local start end
            start=$(date +%s)
            curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors \
              -o shard/ref/hg19.fa.gz \
              https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/hg19.fa.gz
            curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors \
              -o shard/ref/md5sum.txt \
              https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/md5sum.txt
            (
              cd shard/ref
              grep -E '[[:space:]]hg19.fa.gz$' md5sum.txt > hg19.fa.gz.md5
              md5sum --check hg19.fa.gz.md5
              gzip -d hg19.fa.gz
            )

            docker run --rm -v "$PWD/shard:/shard" bounty1-pace:wgbs-cohort-v2 bash -lc '
              set -euo pipefail
              samtools faidx /shard/ref/hg19.fa
              Rscript /work/bin/export_pace_regions.R --output /shard/ref/pace.bed --flank 500
              Rscript /work/bin/export_pace_regions.R --output /shard/ref/pace-screen.raw.bed --flank 1000
            '

            python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path

          src = Path('shard/ref/pace-screen.raw.bed')
          dst = Path('shard/ref/pace-screen.merged.bed')
          by_chrom = defaultdict(list)
          for line in src.read_text(encoding='utf-8').splitlines():
              if not line or line.startswith('#'):
                  continue
              fields = line.split('\t')
              chrom, start, end = fields[0], int(fields[1]), int(fields[2])
              by_chrom[chrom].append((start, end))

          with dst.open('w', encoding='utf-8') as out:
              for chrom in sorted(by_chrom):
                  merged = []
                  for start, end in sorted(by_chrom[chrom]):
                      if not merged or start > merged[-1][1]:
                          merged.append([start, end])
                      else:
                          merged[-1][1] = max(merged[-1][1], end)
                  for start, end in merged:
                      out.write(f'{chrom}\t{start}\t{end}\n')
          PY

            docker run --rm -v "$PWD/shard:/shard" bounty1-pace:wgbs-cohort-v2 bash -lc '
              set -euo pipefail
              : > /shard/ref/pace-screen.fa
              while read -r chrom start end; do
                samtools faidx /shard/ref/hg19.fa "${chrom}:$((start + 1))-${end}"
              done < /shard/ref/pace-screen.merged.bed >> /shard/ref/pace-screen.fa
              test -s /shard/ref/pace-screen.fa
              samtools faidx /shard/ref/pace-screen.fa
              bwameth.py index /shard/ref/pace-screen.fa
              bwameth.py index /shard/ref/hg19.fa
            '
            end=$(date +%s)
            echo $((end-start)) > shard/qc/reference-wall-seconds.txt
            du -sh shard/ref > shard/qc/reference-size.txt
            awk '{sum += $3-$2} END {print sum}' shard/ref/pace-screen.merged.bed > shard/qc/pace-screen-reference-bases.txt
          }

          download_one() {
            local label="$1" url="$2" path="$3" expected="$4"
            local attempt=0 status=1
            while (( attempt < 100 )); do
              attempt=$((attempt + 1))
              echo "${label}: outer resume attempt ${attempt}" >&2
              set +e
              curl --fail --location --show-error --silent --http1.1 \
                --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
                --speed-time 120 --speed-limit 1024 \
                --continue-at - --output "$path" "$url"
              status=$?
              set -e
              if (( status == 0 )); then
                if echo "${expected}  ${path}" | md5sum --check; then
                  gzip -t "$path"
                  echo "${label}: complete after ${attempt} outer attempt(s)" >&2
                  return 0
                fi
                echo "${label}: transfer returned success but MD5 is incomplete/mismatched; resuming" >&2
              else
                echo "${label}: curl exit=${status}; retaining partial file and resuming" >&2
              fi
              sleep 5
            done
            echo "${label}: exhausted 100 resumable attempts" >&2
            return 1
          }

          download_inputs() {
            local start end r1_pid r2_pid r1_status r2_status
            start=$(date +%s)
            download_one R1 "$R1_URL" "shard/raw/${SAMPLE_ID}.R1.fastq.gz" "$MD5_R1" &
            r1_pid=$!
            download_one R2 "$R2_URL" "shard/raw/${SAMPLE_ID}.R2.fastq.gz" "$MD5_R2" &
            r2_pid=$!
            set +e
            wait "$r1_pid"; r1_status=$?
            wait "$r2_pid"; r2_status=$?
            set -e
            printf 'R1 download exit=%s\nR2 download exit=%s\n' "$r1_status" "$r2_status" > "shard/qc/${SAMPLE_ID}.download-status.txt"
            if (( r1_status != 0 || r2_status != 0 )); then
              return 1
            fi
            end=$(date +%s)
            echo $((end-start)) > "shard/qc/${SAMPLE_ID}.download-wall-seconds.txt"
            du -sh shard/raw > "shard/qc/${SAMPLE_ID}.raw-size.txt"
          }

          start=$(date +%s)
          prepare_reference > shard/qc/reference-prep.log 2>&1 &
          ref_pid=$!
          download_inputs > "shard/qc/${SAMPLE_ID}.download.log" 2>&1 &
          dl_pid=$!
          set +e
          wait "$ref_pid"; ref_status=$?
          wait "$dl_pid"; dl_status=$?
          set -e
          printf 'reference exit=%s\ndownload exit=%s\n' "$ref_status" "$dl_status" > "shard/qc/${SAMPLE_ID}.parallel-prep-status.txt"
          if (( ref_status != 0 || dl_status != 0 )); then
            echo 'Parallel preparation failed; inspect QC logs' >&2
            exit 1
          fi
          end=$(date +%s)
          echo $((end-start)) > "shard/qc/${SAMPLE_ID}.parallel-prep-wall-seconds.txt"
          df -h > "shard/qc/${SAMPLE_ID}.disk-after-prep.txt"

      - name: Prefilter complete WGBS to conservative PACE candidates
        env:
          SAMPLE_ID: ${{ matrix.sample_id }}
          MD5_R1: ${{ matrix.md5_r1 }}
          MD5_R2: ${{ matrix.md5_r2 }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker run --rm \
            -e SAMPLE_ID -e MD5_R1 -e MD5_R2 \
            -v "$PWD/shard:/shard" \
            bounty1-pace:wgbs-cohort-v2 bash -lc '
              set -euo pipefail
              cd /shard/out
              bash /work/bin/screen_wgbs_pace_candidates.sh \
                "$SAMPLE_ID" \
                "/shard/raw/${SAMPLE_ID}.R1.fastq.gz" \
                "/shard/raw/${SAMPLE_ID}.R2.fastq.gz" \
                "$MD5_R1" "$MD5_R2" \
                /shard/ref/pace-screen.fa 4
            '
          end=$(date +%s)
          echo $((end-start)) > "shard/qc/${SAMPLE_ID}.prefilter-wall-seconds.txt"
          cp "shard/out/${SAMPLE_ID}.candidate-pair-count.txt" shard/qc/
          cp "shard/out/${SAMPLE_ID}.candidate-fastq-size.txt" shard/qc/
          test -s "shard/out/${SAMPLE_ID}.candidate.R1.fastq.gz"
          test -s "shard/out/${SAMPLE_ID}.candidate.R2.fastq.gz"
          rm -f "shard/raw/${SAMPLE_ID}.R1.fastq.gz" "shard/raw/${SAMPLE_ID}.R2.fastq.gz"
          df -h > "shard/qc/${SAMPLE_ID}.disk-after-prefilter.txt"

      - name: Align PACE candidates to complete hg19 production path
        env:
          SAMPLE_ID: ${{ matrix.sample_id }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker run --rm \
            -e SAMPLE_ID -e WGBS_SKIP_FASTP=1 -e WGBS_SORT_MEM=256M \
            -v "$PWD/shard:/shard" \
            bounty1-pace:wgbs-cohort-v2 bash -lc '
              set -euo pipefail
              cd /shard/out
              bash /work/bin/stream_wgbs_bwameth.sh \
                "$SAMPLE_ID" \
                "${SAMPLE_ID}.candidate.R1.fastq.gz" \
                "${SAMPLE_ID}.candidate.R2.fastq.gz" \
                "" "" \
                /shard/ref/hg19.fa /shard/ref/pace.bed 30 4
            '
          end=$(date +%s)
          echo $((end-start)) > "shard/qc/${SAMPLE_ID}.full-hg19-candidate-wall-seconds.txt"
          test -s "shard/out/${SAMPLE_ID}.mapq30.pace-targets.deduplicated.bam"
          test -s "shard/out/${SAMPLE_ID}.mapq30.pace-targets.deduplicated.bam.bai"
          rm -f "shard/out/${SAMPLE_ID}.candidate.R1.fastq.gz" "shard/out/${SAMPLE_ID}.candidate.R2.fastq.gz"

      - name: Extract PACE-region CpG methylation
        env:
          SAMPLE_ID: ${{ matrix.sample_id }}
        run: |
          set -euo pipefail
          docker run --rm -e SAMPLE_ID -v "$PWD/shard:/shard" bounty1-pace:wgbs-cohort-v2 bash -lc '
            set -euo pipefail
            cd /shard/out
            micromamba run -n methyldackel MethylDackel extract \
              -q 30 -p 5 --minDepth 1 -@ 2 \
              /shard/ref/hg19.fa \
              "${SAMPLE_ID}.mapq30.pace-targets.deduplicated.bam" \
              -o "${SAMPLE_ID}.methyldackel"
            test -s "${SAMPLE_ID}.methyldackel_CpG.bedGraph"
            python3 /work/bin/methyldackel_to_bismark.py \
              --input "${SAMPLE_ID}.methyldackel_CpG.bedGraph" \
              --output "/shard/qc/${SAMPLE_ID}.bismark.cov.gz"
            gzip -t "/shard/qc/${SAMPLE_ID}.bismark.cov.gz"
            test "$(gzip -cd "/shard/qc/${SAMPLE_ID}.bismark.cov.gz" | wc -l)" -gt 0
          '
          gzip -cd "shard/qc/${SAMPLE_ID}.bismark.cov.gz" | wc -l > "shard/qc/${SAMPLE_ID}.coverage-row-count.txt"

      - name: Record shard provenance and compact diagnostics
        if: always()
        env:
          SAMPLE_ID: ${{ matrix.sample_id }}
          CONDITION: ${{ matrix.condition }}
          REPLICATE: ${{ matrix.replicate }}
          RUN_ACCESSION: ${{ matrix.run_accession }}
        run: |
          set +e
          mkdir -p shard/qc
          for suffix in \
            pace-screen.source-stream.log \
            pace-screen.fastp.json \
            pace-screen.fastp.html \
            pace-screen.fastp.stderr.log \
            pace-screen.bwameth.stderr.log \
            pace-screen.samtools-view.stderr.log \
            pace-screen.samtools-fastq.stderr.log \
            pace-screen.pipeline-status.txt; do
            cp "shard/out/${SAMPLE_ID}.${suffix}" shard/qc/ 2>/dev/null || true
          done
          cp "shard/out/${SAMPLE_ID}.source-stream.log" shard/qc/ 2>/dev/null || true
          cp "shard/out/${SAMPLE_ID}.bwameth.stderr.log" shard/qc/ 2>/dev/null || true
          cp "shard/out/${SAMPLE_ID}.samtools-view.stderr.log" shard/qc/ 2>/dev/null || true
          cp "shard/out/${SAMPLE_ID}.pipeline-status.txt" shard/qc/ 2>/dev/null || true
          cp "shard/out/${SAMPLE_ID}.pace-targets.flagstat.txt" shard/qc/ 2>/dev/null || true
          df -h > "shard/qc/${SAMPLE_ID}.final-disk.txt"
          du -sh shard > "shard/qc/${SAMPLE_ID}.final-working-set.txt" 2>/dev/null || true
          cat > "shard/qc/${SAMPLE_ID}.provenance.txt" <<EOF
          sample_id=${SAMPLE_ID}
          condition=${CONDITION}
          replicate=${REPLICATE}
          run_accession=${RUN_ACCESSION}
          source_scope=complete paired FASTQ archives, published MD5 verified before screening
          prefilter=fastp once then bisulfite screen against merged official DunedinPACE +/-1000bp windows; keep pair if either primary mate maps
          screen_purpose=candidate reduction only; final alignment remains complete hg19
          final_reference=complete checksum-verified UCSC hg19
          final_mapq_threshold=30
          final_target_scope=official DunedinPACE probe windows +/-500bp
          duplicate_removal=after complete-hg19 candidate alignment within each biological sample
          methylation_min_depth_raw=1
          final_dunedinpace_min_depth=6
          EOF

      - name: Upload WGBS shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty1-wgbs-v2-${{ matrix.sample_id }}
          path: shard/qc
          if-no-files-found: error
          retention-days: 14

  pace:
    needs: [plan, wgbs]
    if: ${{ needs.wgbs.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bounty1-wgbs-v2-*
          path: cohort-cov
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Load pinned analysis image from shared cache
        uses: docker/build-push-action@v6
        with:
          context: bounty1
          load: true
          pull: true
          tags: bounty1-pace:wgbs-cohort-v2
          cache-from: type=gha,scope=bounty1-docker
          cache-to: type=gha,mode=max,scope=bounty1-docker
      - name: Compute measured DunedinPACE scores
        run: |
          set -euo pipefail
          test "$(find cohort-cov -name '*.bismark.cov.gz' | wc -l)" -eq "${{ needs.plan.outputs.count }}"
          test "$(find cohort-cov -name '*.bismark.cov.gz' | wc -l)" -ge 3
          docker run --rm \
            -v "$PWD/cohort-cov:/cohort:ro" \
            -v "$PWD:/repo" \
            bounty1-pace:wgbs-cohort-v2 bash -lc '
              set -euo pipefail
              Rscript /work/bin/compute_dunedinpace.R \
                --cov-dir /cohort \
                --scores /repo/dunedinpace_scores.csv \
                --qc /repo/pace_probe_qc.csv \
                --model-metadata /repo/pace_model_metadata.csv \
                --min-probe-fraction 0.80 \
                --min-depth 6
            '
          test -s dunedinpace_scores.csv
          test -s pace_probe_qc.csv
          test -s pace_model_metadata.csv
      - name: Upload measured DunedinPACE cohort outputs
        uses: actions/upload-artifact@v4
        with:
          name: bounty1-wgbs-cohort-v2-pace
          path: |
            dunedinpace_scores.csv
            pace_probe_qc.csv
            pace_model_metadata.csv
          if-no-files-found: error
          retention-days: 30
