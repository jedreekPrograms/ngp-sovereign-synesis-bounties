name: Bounty 1 WGBS Abismal parallelism benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bounty1-wgbs-prefilter-benchmark.yml'

permissions:
  contents: read

jobs:
  benchmark:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'bounty-1-real-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Load pinned analysis image from shared cache
        uses: docker/build-push-action@v6
        with:
          context: bounty1
          load: true
          pull: true
          tags: bounty1-pace:prefilter-bench
          cache-from: type=gha,scope=bounty1-docker
          cache-to: type=gha,mode=max,scope=bounty1-docker

      - name: Prepare one real 1M-pair WT prefix and validated PACE +/-2 kb Abismal index
        run: |
          set -euo pipefail
          mkdir -p bench/raw bench/ref bench/out bench/chunks
          python3 - <<'PY'
          import gzip, urllib.request
          from pathlib import Path

          urls = {
              'R1': 'https://download.cncb.ac.cn/gsa-human/HRA003336/HRR1202754/HRR1202754_f1.fq.gz',
              'R2': 'https://download.cncb.ac.cn/gsa-human/HRA003336/HRR1202754/HRR1202754_r2.fq.gz',
          }
          n = 1_000_000
          for mate, url in urls.items():
              out = Path(f'bench/raw/WT_rep1.{mate}.fastq.gz')
              req = urllib.request.Request(url, headers={'User-Agent': 'bounty1-abismal-parallel-benchmark/1'})
              with urllib.request.urlopen(req, timeout=60) as resp, gzip.GzipFile(fileobj=resp) as src, gzip.open(out, 'wb', compresslevel=1) as dst:
                  for i in range(n):
                      rec = [src.readline() for _ in range(4)]
                      if any(not x for x in rec):
                          raise SystemExit(f'{mate}: source ended before {n} records at {i}')
                      dst.writelines(rec)
          PY
          gzip -t bench/raw/WT_rep1.R1.fastq.gz
          gzip -t bench/raw/WT_rep1.R2.fastq.gz

          # Split the same exact input into four 250k-pair chunks. Every mode
          # below maps these identical chunks, so candidate-set equality is a
          # fail-closed guard on the parallelism experiment.
          python3 - <<'PY'
          import gzip
          from pathlib import Path

          pairs_per_chunk = 250_000
          for mate in ('R1', 'R2'):
              with gzip.open(f'bench/raw/WT_rep1.{mate}.fastq.gz', 'rb') as src:
                  for chunk in range(1, 5):
                      out = Path(f'bench/chunks/q{chunk}.{mate}.fastq')
                      with out.open('wb') as dst:
                          for i in range(pairs_per_chunk):
                              rec = [src.readline() for _ in range(4)]
                              if any(not x for x in rec):
                                  raise SystemExit(f'{mate}: truncated while writing chunk {chunk} pair {i}')
                              dst.writelines(rec)
                  if src.readline():
                      raise SystemExit(f'{mate}: benchmark prefix unexpectedly contains >1M records')
          PY

          curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors \
            -o bench/ref/hg19.fa.gz \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/hg19.fa.gz
          curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors \
            -o bench/ref/md5sum.txt \
            https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/md5sum.txt
          (
            cd bench/ref
            grep -E '[[:space:]]hg19.fa.gz$' md5sum.txt > hg19.fa.gz.md5
            md5sum --check hg19.fa.gz.md5
            gzip -d hg19.fa.gz
          )

          docker run --rm -v "$PWD/bench:/bench" bounty1-pace:prefilter-bench bash -lc '
            set -euo pipefail
            samtools faidx /bench/ref/hg19.fa
            Rscript /work/bin/export_pace_regions.R --output /bench/ref/pace.bed --flank 500
            python3 - /bench/ref/pace.bed /bench/ref/pace-screen-2k.merged.bed <<"PY"
          from collections import defaultdict
          from pathlib import Path
          import sys
          by = defaultdict(list)
          for line in Path(sys.argv[1]).read_text().splitlines():
              if not line or line.startswith("#"):
                  continue
              f = line.split("\t")
              by[f[0]].append((max(0, int(f[1]) - 1500), int(f[2]) + 1500))
          with Path(sys.argv[2]).open("w") as out:
              for chrom in sorted(by):
                  merged = []
                  for start, end in sorted(by[chrom]):
                      if not merged or start > merged[-1][1]:
                          merged.append([start, end])
                      else:
                          merged[-1][1] = max(merged[-1][1], end)
                  for start, end in merged:
                      out.write(f"{chrom}\t{start}\t{end}\n")
          PY
            : > /bench/ref/pace-screen-2k.fa
            while read -r chrom start end; do
              samtools faidx /bench/ref/hg19.fa "${chrom}:$((start+1))-${end}"
            done < /bench/ref/pace-screen-2k.merged.bed >> /bench/ref/pace-screen-2k.fa
            test -s /bench/ref/pace-screen-2k.fa
            micromamba run -n abismal abismal idx -t 4 \
              /bench/ref/pace-screen-2k.fa /bench/ref/pace-screen-2k.fa.abismal.idx
            test -s /bench/ref/pace-screen-2k.fa.abismal.idx
          '

      - name: Benchmark 1x4 vs 2x2 vs 4x1 Abismal process layouts
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/bench:/bench" bounty1-pace:prefilter-bench bash -lc '
            set -euo pipefail
            cd /bench
            idx=/bench/ref/pace-screen-2k.fa.abismal.idx

            map_chunk() {
              mode="$1"; chunk="$2"; threads="$3"
              sam="/bench/out/${mode}.q${chunk}.sam"
              names="/bench/out/${mode}.q${chunk}.names.txt"
              log="/bench/out/${mode}.q${chunk}.stderr.log"
              micromamba run -n abismal abismal map \
                -i "$idx" -t "$threads" -a -m 0.20 \
                -o "$sam" "/bench/chunks/q${chunk}.R1.fastq" "/bench/chunks/q${chunk}.R2.fastq" \
                2> "$log"
              test -s "$sam"
              awk -F "\t" '\''!/^@/ { if (int($2 / 4) % 2 == 0) { q=$1; sub(/\/[12]$/, "", q); print q } }'\'' "$sam" | LC_ALL=C sort -u > "$names"
              test -s "$names"
              rm -f "$sam"
            }

            # Baseline: one 4-thread Abismal process at a time (same semantics
            # as the current sequential production chunk helper).
            start=$(date +%s)
            for q in 1 2 3 4; do map_chunk serial4 "$q" 4; done
            serial_seconds=$(( $(date +%s) - start ))
            LC_ALL=C sort -u /bench/out/serial4.q*.names.txt > /bench/out/serial4.names.txt

            # Two independent 2-thread mappers, keeping total requested CPU=4.
            start=$(date +%s)
            for first in 1 3; do
              second=$((first + 1))
              map_chunk parallel2x2 "$first" 2 & p1=$!
              map_chunk parallel2x2 "$second" 2 & p2=$!
              wait "$p1"; wait "$p2"
            done
            p2_seconds=$(( $(date +%s) - start ))
            LC_ALL=C sort -u /bench/out/parallel2x2.q*.names.txt > /bench/out/parallel2x2.names.txt

            # Four independent single-thread mappers, again CPU budget=4.
            start=$(date +%s)
            pids=""
            for q in 1 2 3 4; do
              map_chunk parallel4x1 "$q" 1 & pids="$pids $!"
            done
            for p in $pids; do wait "$p"; done
            p4_seconds=$(( $(date +%s) - start ))
            LC_ALL=C sort -u /bench/out/parallel4x1.q*.names.txt > /bench/out/parallel4x1.names.txt

            comm -3 /bench/out/serial4.names.txt /bench/out/parallel2x2.names.txt > /bench/out/serial-vs-2x2.diff.txt
            comm -3 /bench/out/serial4.names.txt /bench/out/parallel4x1.names.txt > /bench/out/serial-vs-4x1.diff.txt
            d2=$(wc -l < /bench/out/serial-vs-2x2.diff.txt)
            d4=$(wc -l < /bench/out/serial-vs-4x1.diff.txt)
            n=$(wc -l < /bench/out/serial4.names.txt)
            s2=$(awk -v a="$serial_seconds" -v b="$p2_seconds" '"'"'BEGIN { if (b==0) print "inf"; else printf "%.3f", a/b }'"'"')
            s4=$(awk -v a="$serial_seconds" -v b="$p4_seconds" '"'"'BEGIN { if (b==0) print "inf"; else printf "%.3f", a/b }'"'"')
            {
              echo "input_pairs=1000000"
              echo "chunk_pairs=250000"
              echo "validated_screen_context_bp_each_side=2000"
              echo "max_edit_distance=0.20"
              echo "candidate_qnames=$n"
              echo "serial_1x4_seconds=$serial_seconds"
              echo "parallel_2x2_seconds=$p2_seconds"
              echo "parallel_4x1_seconds=$p4_seconds"
              echo "speedup_2x2_vs_serial=$s2"
              echo "speedup_4x1_vs_serial=$s4"
              echo "candidate_diff_2x2_vs_serial=$d2"
              echo "candidate_diff_4x1_vs_serial=$d4"
            } | tee /bench/out/summary.txt
            test "$d2" -eq 0
            test "$d4" -eq 0
          '

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty1-wgbs-abismal-parallelism-benchmark
          path: |
            bench/out/summary.txt
            bench/out/*.diff.txt
            bench/out/*.stderr.log
          if-no-files-found: warn
          retention-days: 14
