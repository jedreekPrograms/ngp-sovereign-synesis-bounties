name: Bounty 1 WGBS Abismal production screen smoke

on:
  pull_request:
    paths:
      - 'bounty1/bin/screen_wgbs_pace_candidates.sh'
      - 'bounty1/bin/chunked_abismal_screen.py'
      - 'bounty1/bin/split_interleaved_fastq.py'
      - '.github/workflows/bounty1-wgbs-abismal-production-smoke.yml'
  push:
    branches:
      - bounty-1-real-pipeline
    paths:
      - 'bounty1/abismal-production-smoke.trigger'
      - '.github/workflows/bounty1-wgbs-abismal-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Load pinned analysis image
        uses: docker/build-push-action@v6
        with:
          context: bounty1
          load: true
          pull: true
          tags: bounty1-pace:abismal-production-smoke
          cache-from: type=gha,scope=bounty1-docker
          cache-to: type=gha,mode=max,scope=bounty1-docker

      - name: Prepare 100k authentic WT pairs and validated PACE +/-2 kb reference
        run: |
          set -euo pipefail
          mkdir -p shard/raw shard/ref shard/out shard/qc
          python3 - <<'PY'
          import gzip, urllib.request
          from pathlib import Path
          urls = {
              'R1': 'https://download.cncb.ac.cn/gsa-human/HRA003336/HRR1202754/HRR1202754_f1.fq.gz',
              'R2': 'https://download.cncb.ac.cn/gsa-human/HRA003336/HRR1202754/HRR1202754_r2.fq.gz',
          }
          for mate, url in urls.items():
              out = Path(f'shard/raw/WT_smoke.{mate}.fastq.gz')
              req = urllib.request.Request(url, headers={'User-Agent':'bounty1-abismal-production-smoke/1'})
              with urllib.request.urlopen(req, timeout=60) as resp, gzip.GzipFile(fileobj=resp) as src, gzip.open(out,'wb',compresslevel=1) as dst:
                  for _ in range(100_000):
                      rec=[src.readline() for _ in range(4)]
                      if any(not x for x in rec):
                          raise SystemExit(f'{mate}: source ended early')
                      dst.writelines(rec)
          PY
          gzip -t shard/raw/WT_smoke.R1.fastq.gz
          gzip -t shard/raw/WT_smoke.R2.fastq.gz
          md5sum shard/raw/WT_smoke.R1.fastq.gz | awk '{print $1}' > shard/raw/R1.md5
          md5sum shard/raw/WT_smoke.R2.fastq.gz | awk '{print $1}' > shard/raw/R2.md5

          curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors \
            -o shard/ref/hg19.fa.gz https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/hg19.fa.gz
          curl -fsSL --retry 10 --retry-delay 5 --retry-all-errors \
            -o shard/ref/md5sum.txt https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/md5sum.txt
          (
            cd shard/ref
            grep -E '[[:space:]]hg19.fa.gz$' md5sum.txt > hg19.fa.gz.md5
            md5sum --check hg19.fa.gz.md5
            gzip -d hg19.fa.gz
          )
          docker run --rm -v "$PWD/shard:/shard" bounty1-pace:abismal-production-smoke bash -lc '
            set -euo pipefail
            samtools faidx /shard/ref/hg19.fa
            Rscript /work/bin/export_pace_regions.R --output /shard/ref/pace-screen.raw.bed --flank 2000
          '
          python3 - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          by=defaultdict(list)
          for line in Path('shard/ref/pace-screen.raw.bed').read_text().splitlines():
              if not line or line.startswith('#'): continue
              f=line.split('\t'); by[f[0]].append((int(f[1]),int(f[2])))
          with Path('shard/ref/pace-screen.merged.bed').open('w') as out:
              for chrom in sorted(by):
                  merged=[]
                  for s,e in sorted(by[chrom]):
                      if not merged or s>merged[-1][1]: merged.append([s,e])
                      else: merged[-1][1]=max(merged[-1][1],e)
                  for s,e in merged: out.write(f'{chrom}\t{s}\t{e}\n')
          PY
          docker run --rm -v "$PWD/shard:/shard" bounty1-pace:abismal-production-smoke bash -lc '
            set -euo pipefail
            : > /shard/ref/pace-screen.fa
            while read -r chrom start end; do
              samtools faidx /shard/ref/hg19.fa "${chrom}:$((start+1))-${end}"
            done < /shard/ref/pace-screen.merged.bed >> /shard/ref/pace-screen.fa
            test -s /shard/ref/pace-screen.fa
          '

      - name: Run exact production candidate screen
        run: |
          set -euo pipefail
          r1_md5=$(cat shard/raw/R1.md5)
          r2_md5=$(cat shard/raw/R2.md5)
          docker run --rm \
            -e SAMPLE_ID=WT_smoke -e R1_MD5="$r1_md5" -e R2_MD5="$r2_md5" \
            -v "$PWD/shard:/shard" bounty1-pace:abismal-production-smoke bash -lc '
              set -euo pipefail
              cd /shard/out
              bash /work/bin/screen_wgbs_pace_candidates.sh \
                WT_smoke /shard/raw/WT_smoke.R1.fastq.gz /shard/raw/WT_smoke.R2.fastq.gz \
                "$R1_MD5" "$R2_MD5" /shard/ref/pace-screen.fa 4
            '
          test -s shard/out/WT_smoke.candidate.R1.fastq.gz
          test -s shard/out/WT_smoke.candidate.R2.fastq.gz
          gzip -t shard/out/WT_smoke.candidate.R1.fastq.gz
          gzip -t shard/out/WT_smoke.candidate.R2.fastq.gz
          pairs=$(cat shard/out/WT_smoke.candidate-pair-count.txt)
          echo "candidate_pairs=${pairs}" | tee shard/qc/summary.txt
          # Same input/reference/parameters as the successful context benchmark.
          # Allow a tiny implementation tolerance but fail loudly on semantic drift.
          test "$pairs" -ge 22000
          test "$pairs" -le 23100
          grep -q '^stream_interleaved_fastq=0$' shard/out/WT_smoke.pace-screen.pipeline-status.txt
          grep -q '^fastp=0$' shard/out/WT_smoke.pace-screen.pipeline-status.txt
          grep -q '^chunked_abismal_screen=0$' shard/out/WT_smoke.pace-screen.pipeline-status.txt

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounty1-wgbs-abismal-production-smoke
          path: |
            shard/qc/summary.txt
            shard/out/WT_smoke.candidate-pair-count.txt
            shard/out/WT_smoke.candidate-fastq-size.txt
            shard/out/WT_smoke.pace-screen.pipeline-status.txt
            shard/out/WT_smoke.pace-screen.*.log
            shard/out/WT_smoke.pace-screen.*.yaml
          if-no-files-found: warn
          retention-days: 14
